# The backup copy of ClearBill on GitHub Pages (R25): free for a public
# repository, and it keeps the app usable if the Cloud Run site is down.
# Built by 06_app/lib/build_static.js from the same index.html; photo reading
# there uses the visitor's own free Gemini key (there is no server).
# Needs, once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Backup copy on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['06_app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the backup copy
        run: node 06_app/lib/build_static.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
