# The backup copy of ClearBill on GitHub Pages (R25): free for a public
# repository, and it keeps the app usable if the Cloud Run site is down.
# Built by 06_app/lib/build_static.js from the same index.html; photo reading
# there uses the visitor's own free Gemini key (there is no server).
#
# Pages is on (Settings -> Pages -> Source: GitHub Actions, since 10 Nov 2026)
# and the copy is live at https://aaryap1.github.io/ClearBill/, which BACKUP_URL
# in 06_app/index.html links to. If Pages is ever switched off, the "check" job
# finds it off and the deploy job is skipped (not failed), so pushes stay green.
name: Backup copy on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['06_app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      on: ${{ steps.pages.outputs.on }}
    steps:
      - name: Is GitHub Pages switched on for this repository?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off for this repository, so the backup copy was not published. Switch it on: Settings -> Pages -> Source: GitHub Actions."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.on == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the backup copy
        run: node 06_app/lib/build_static.js _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
